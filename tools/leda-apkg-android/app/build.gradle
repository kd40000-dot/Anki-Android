plugins { id 'com.android.application' }
android {
    namespace 'com.anki.ledaaudio'
    compileSdk 35
    defaultConfig {
        applicationId 'com.anki.ledaaudio'
        minSdk 26
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        consistentDebug {
            storeFile file('../../fallback-release-keystore.jks')
            storePassword 'Test@123'
            keyAlias 'my-key'
            keyPassword 'Test@123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.consistentDebug }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'com.github.luben:zstd-jni:1.5.5-4@aar'
}
