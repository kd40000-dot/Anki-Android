name: Build AnkiDroid Typed Retry APK

on:
  push:
    branches:
      - chatgpt/typed-retry-rating
      - chatgpt/typed-retry-andors-provider
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-provider: basic

      - name: Build stable side-by-side retry APK
        run: ./gradlew :AnkiDroid:assembleFullDebug --daemon

      - name: List APK outputs
        run: find AnkiDroid/build/outputs/apk/full/debug -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ankidroid-typed-retry-apks
          path: AnkiDroid/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
