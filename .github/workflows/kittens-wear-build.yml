name: Build Kittens Wear 1.1.2

on:
  push:
    branches:
      - kittens-wear-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat .kittens-build/overlay.part0 .kittens-build/overlay.part1 .kittens-build/overlay.part2 .kittens-build/overlay.part3 .kittens-build/overlay.part4 > /tmp/kittens-overlay.b64
          base64 -d /tmp/kittens-overlay.b64 > /tmp/kittens-overlay.tar.gz
          echo "0f41a4377f30cd1f8a25945f99b29d813709e57751095093d526d0f92ad7b6f1  /tmp/kittens-overlay.tar.gz" | sha256sum -c -

          rm -rf wear-kittens /tmp/kittensgame
          mkdir -p wear-kittens/app/src/main/assets/game
          git clone --filter=blob:none https://github.com/nuclear-unicorn/kittensgame.git /tmp/kittensgame
          git -C /tmp/kittensgame checkout 781e379f79f1e7512d168849cba21ed111502644
          rsync -a --exclude=.git /tmp/kittensgame/ wear-kittens/app/src/main/assets/game/
          tar -xzf /tmp/kittens-overlay.tar.gz -C wear-kittens

          cp .kittens-build/KittensComplicationService.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/KittensComplicationService.java
          cp .kittens-build/ComplicationStore.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/ComplicationStore.java
          cp .kittens-build/LocalGameServer.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/LocalGameServer.java
          cp .kittens-build/AndroidManifest.xml wear-kittens/app/src/main/AndroidManifest.xml
          cp .kittens-build/app-build.gradle wear-kittens/app/build.gradle

          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path("wear-kittens/app/src/main/assets/game/wear.js")
          s=p.read_text()
          export_new="""button('Export save',async()=>{try{const response=await fetch('/export',{method:'POST',body:JSON.stringify({exportText:game.compressLZData(JSON.stringify(game.save()))})});if(response.status===403){detail('<h2>Storage access needed</h2><p>Android opened the file-access setting. Enable <b>Allow access to manage all files</b>, return to Kittens Wear, then tap <b>Export save</b> again.</p>');return;}if(!response.ok)throw Error();const result=await response.json();detail('<h2>Save exported</h2><p><b>kittens-save.txt</b></p><p>Saved in <b>/storage/emulated/0/Kittens Game/</b>.</p>');}catch(e){status('Export failed. Try Save now.');}},settings);"""
          import_new="""button('Import save file',async()=>{try{const r=await fetch('/import');if(r.status===403){detail('<h2>Storage access needed</h2><p>Android opened the file-access setting. Enable <b>Allow access to manage all files</b>, return to Kittens Wear, then tap <b>Import save file</b> again.</p>');return;}if(!r.ok){detail('<h2>Import a save</h2><p>Place <b>kittens-import.txt</b> in <b>/storage/emulated/0/Kittens Game/</b>, then tap Import again. It can contain a web export or save JSON.</p>');return;}let text=await r.text();if(!confirm('Replace your current village with this save?'))return;await importSave(text);}catch(e){console.error('Import error',e);detail('<h2>Import failed</h2><p>The current village has been kept. Check the save file.</p>');}},settings);"""
          s,n1=re.subn(r"button\('Export save'.*?\},settings\);",lambda m:export_new,s,count=1)
          s,n2=re.subn(r"button\('Import save file'.*?\},settings\);",lambda m:import_new,s,count=1)
          if n1!=1 or n2!=1: raise SystemExit(f"wear.js patch failed export={n1} import={n2}")
          s=re.sub(r"Kittens Wear 1\.1\.\d+","Kittens Wear 1.1.2",s)
          p.write_text(s)
          PY

          keytool -genkeypair -v             -keystore wear-kittens/personal.jks             -storepass kittenswear-1.1.2             -keypass kittenswear-1.1.2             -alias kittens             -keyalg RSA -keysize 2048 -validity 36500             -dname "CN=Kittens Wear Personal Build, O=Personal, C=ES"

      - name: Build signed release APK
        shell: bash
        working-directory: wear-kittens
        env:
          KITTENS_KEYSTORE_PASSWORD: kittenswear-1.1.2
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kittens-WearOS5-1.1.2.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kittens-WearOS5-1.1.2
          path: Kittens-WearOS5-1.1.2.apk
          if-no-files-found: error
          retention-days: 7
