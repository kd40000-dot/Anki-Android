name: Build Kittens Wear 1.1.8

on:
  push:
    branches:
      - kittens-wear-build

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mv /tmp/android-cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Reconstruct project
        shell: bash
        run: |
          set -euo pipefail
          cat .kittens-build/overlay.part0 .kittens-build/overlay.part1 .kittens-build/overlay.part2 .kittens-build/overlay.part3 .kittens-build/overlay.part4 > /tmp/kittens-overlay.b64
          base64 -d /tmp/kittens-overlay.b64 > /tmp/kittens-overlay.tar.gz
          echo "0f41a4377f30cd1f8a25945f99b29d813709e57751095093d526d0f92ad7b6f1  /tmp/kittens-overlay.tar.gz" | sha256sum -c -

          rm -rf wear-kittens /tmp/kittensgame
          mkdir -p wear-kittens/app/src/main/assets/game
          git clone --filter=blob:none https://github.com/nuclear-unicorn/kittensgame.git /tmp/kittensgame
          git -C /tmp/kittensgame checkout 781e379f79f1e7512d168849cba21ed111502644
          rsync -a --exclude=.git /tmp/kittensgame/ wear-kittens/app/src/main/assets/game/
          tar -xzf /tmp/kittens-overlay.tar.gz -C wear-kittens

          cp .kittens-build/KittensComplicationService.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/KittensComplicationService.java
          cp .kittens-build/ComplicationStore.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/ComplicationStore.java
          cp .kittens-build/LocalGameServer.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/LocalGameServer.java
          cp .kittens-build/MainActivity.java wear-kittens/app/src/main/java/com/balthazar/kittenswear/MainActivity.java
          cp .kittens-build/AndroidManifest.xml wear-kittens/app/src/main/AndroidManifest.xml
          cp .kittens-build/app-build.gradle wear-kittens/app/build.gradle

          cp .kittens-build/wear.js wear-kittens/app/src/main/assets/game/wear.js

          keytool -genkeypair -v             -keystore wear-kittens/personal.jks             -storepass kittenswear-1.1.8             -keypass kittenswear-1.1.8             -alias kittens             -keyalg RSA -keysize 2048 -validity 36500             -dname "CN=Kittens Wear Personal Build, O=Personal, C=ES"

      - name: Build signed release APK
        shell: bash
        working-directory: wear-kittens
        env:
          KITTENS_KEYSTORE_PASSWORD: kittenswear-1.1.8
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace
          test -f app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Kittens-WearOS5-1.1.8.apk"

      - name: Build x86_64 smoke-test APK
        shell: bash
        working-directory: wear-kittens
        run: |
          set -euo pipefail
          gradle :app:assembleDebug -PemulatorBuild --no-daemon --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Runtime save-transfer smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_small_round
          disable-animations: true
          script: |
            set -eu
            adb install -r wear-kittens/app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.balthazar.kittenswear || true
            adb shell am start -W -n com.balthazar.kittenswear/.MainActivity
            adb forward tcp:18742 tcp:18742
            ok=0
            for i in $(seq 1 120); do
              if curl -fsS http://127.0.0.1:18742/diagnostic/status -o /tmp/diag.json; then
                cat /tmp/diag.json
                state=$(python3 -c 'import json; print(json.load(open("/tmp/diag.json")).get("state",""))' 2>/dev/null || true)
                if [ "$state" = success ]; then ok=1; break; fi
                if [ "$state" = error ]; then echo "Runtime self-test failed"; exit 1; fi
              fi
              sleep 1
            done
            test "$ok" = 1

            curl -fsS -X POST http://127.0.0.1:18742/diagnostic/start-transfer -o /tmp/start.json
            cat /tmp/start.json
            python3 - <<'PY'
            import json
            x=json.load(open('/tmp/start.json'))
            assert x.get('state')=='success', x
            assert x.get('sha256') and len(x['sha256'])==64, x
            assert x.get('characters',0)>20, x
            open('/tmp/path','w').write('/'+x['url'].split('/',3)[3])
            open('/tmp/sha','w').write(x['sha256'])
            PY

            adb forward tcp:18743 tcp:18743
            path=$(cat /tmp/path)
            curl -fsS "http://127.0.0.1:18743${path}" -o /tmp/page.html
            grep -q "Kittens Wear transfer" /tmp/page.html
            curl -fsS "http://127.0.0.1:18743${path}download" -o /tmp/save.txt
            test -s /tmp/save.txt
            echo "$(cat /tmp/sha)  /tmp/save.txt" | sha256sum -c -

            curl -fsS -X POST -H 'Content-Type: text/plain;charset=utf-8' --data-binary @/tmp/save.txt "http://127.0.0.1:18743${path}import" -o /tmp/import.json
            cat /tmp/import.json
            python3 - <<'PY'
            import json
            imp=json.load(open('/tmp/import.json'))
            assert imp.get('state')=='success', imp
            assert imp.get('sha256')==open('/tmp/sha').read().strip(), imp
            PY

            curl -fsS http://127.0.0.1:18742/transfer/status -o /tmp/status.json
            cat /tmp/status.json
            python3 - <<'PY'
            import json
            x=json.load(open('/tmp/status.json'))
            assert x.get('active') is True, x
            assert x.get('pending') is True, x
            assert x.get('pendingSha256')==open('/tmp/sha').read().strip(), x
            PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kittens-WearOS5-1.1.8
          path: Kittens-WearOS5-1.1.8.apk
          if-no-files-found: error
          retention-days: 7
