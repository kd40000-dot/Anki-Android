name: Build Andors Trail Anki Combat APK

on:
  push:
    branches:
      - chatgpt/andors-anki-combat
    paths:
      - "andors-trail-integration/**"
      - ".github/workflows/build_andors_anki_combat.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andors-anki-combat
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v4
        with:
          path: integration-repo

      - name: Checkout current Andor's Trail
        uses: actions/checkout@v4
        with:
          repository: AndorsTrailRelease/andors-trail
          ref: master
          path: andors-src
          filter: blob:none
          sparse-checkout: |
            AndorsTrail
          sparse-checkout-cone-mode: true

      - name: Configure JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Apply Anki combat integration
        run: python3 integration-repo/andors-trail-integration/apply_patch.py andors-src

      - name: Build debug APK
        working-directory: andors-src/AndorsTrail
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: List APK outputs
        run: find andors-src/AndorsTrail/app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andors-trail-anki-combat-apk
          path: andors-src/AndorsTrail/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
