name: Build AnkiDroid Undo APK

on:
  push:
    branches:
      - chatgpt/undo-js-api
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: jetbrains
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      - name: Build side-by-side universal debug APK
        run: ./gradlew :AnkiDroid:assembleFullDebug --daemon

      - name: List APK outputs
        run: find AnkiDroid/build/outputs/apk/full/debug -maxdepth 1 -type f -name "*.apk" -print

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ankidroid-undo-debug-apks
          path: AnkiDroid/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14
