name: Build Leda Anki Audio Updater APK
# Credentials-picker recovery release, stable signing, safe diagnostics.
# Rebuild after Java compile fix and atomic output verification.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build_leda_anki_apkg_app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated Leda Android application
        uses: actions/checkout@v5
        with:
          ref: fix/leda-credentials-picker-recovery-2026-10-20
          sparse-checkout: |
            tools/leda-apkg-android
            tools/fallback-release-keystore.jks

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Compile standalone Leda audio updater
        run: gradle -p tools/leda-apkg-android :app:assembleDebug --no-daemon --stacktrace

      - name: Check APK includes Android Zstandard native libraries
        run: |
          APK="$(find tools/leda-apkg-android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -s "$APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libzstd-jni'
          unzip -t "$APK" | tail -1

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Anki-Leda-Audio-Updater-Android-APK
          path: tools/leda-apkg-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
