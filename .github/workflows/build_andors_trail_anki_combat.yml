name: Build Andor's Trail Anki Combat APK

on:
  push:
    branches:
      - chatgpt/andors-trail-anki-combat
      - chatgpt/andors-trail-anki-resilient
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: andors-trail-anki-combat
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout integration files
        uses: actions/checkout@v5

      - name: Checkout current Andor's Trail upstream
        uses: actions/checkout@v5
        with:
          repository: AndorsTrailRelease/andors-trail
          ref: master
          path: andors-upstream

      - name: Apply combat integration overlay
        run: cp -a andors-trail-combat/overlay/. andors-upstream/

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 36 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build and test
        run: |
          cd andors-upstream/AndorsTrail
          ./gradlew testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: andors-trail-anki-combat-debug-apk
          path: andors-upstream/AndorsTrail/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
